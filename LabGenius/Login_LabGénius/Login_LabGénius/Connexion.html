<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabGénius – Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Connexion.css">
</head>
<body>

<!-- Card -->
<div class="card">
    <div class="logo">
        <h1>Lab<span>Génius</span></h1>
        <p>Explorez l'impossible • Innovez sans limites</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Se connecter</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">S'inscrire</button>
    </div>

    <!-- Message feedback -->
    <div class="msg" id="feedback"></div>

    <!-- Formulaire Connexion -->
    <div class="form-panel active" id="panel-login">
        <form id="login-form" action="Traitement.php" method="POST" onsubmit="handleSubmit(event,'login')">
            <div class="input-box">
                <input type="email" id="login-email" name="email" required>
                <label for="login-email">Adresse email</label>
            </div>
            <div class="input-box">
                <input type="password" id="login-password" name="password" required>
                <label for="login-password">Mot de passe</label>
            </div>
            <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>
            <button type="submit" class="submit-btn" id="login-btn">
                <span class="btn-text">Connexion</span>
                <div class="btn-spinner" id="login-spinner"></div>
            </button>
        </form>

        <div class="divider"><span>ou continuer avec</span></div>

        <div class="social-row">
            <button class="social-btn">
                <svg viewBox="0 0 24 24" fill="none"><path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 01-2 3.1v2.5h3.3c1.9-1.8 3-4.4 3-7.4z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3v2.6A10 10 0 0012 22z" fill="#34A853"/><path d="M6.4 14a6 6 0 010-4l-3.4-2.6A10 10 0 002 12c0 1.6.4 3.1 1 4.5L6.4 14z" fill="#FBBC05"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 003 9.5L6.4 12C7.2 9.7 9.4 5.9 12 5.9z" fill="#EA4335"/></svg>
                Google
            </button>
            <button class="social-btn">
                <svg viewBox="0 0 24 24" fill="white"><path d="M18.7 12.4c0-3-2.4-4.4-2.5-4.5 1.4-2 3.5-2.3 4.2-2.3-.2-1.7-1.3-3.3-2.3-4.2A6.5 6.5 0 0016 .7c-1.5 0-2.7 1-3.4 1-1 0-2-.9-3.3-.9C6.8.8 4 3.2 4 7.3c0 2.6 1 5.4 2.2 7.2 1.2 1.7 2.3 3.5 4 3.5 1.5 0 2.1-1 3.8-1 1.7 0 2.2 1 3.8 1 1.7 0 2.8-1.8 4-3.5-.4-.2-1.1-.7-1.1-2.1zM14.5 2.3c.8-1 1.4-2.3 1.2-3.5-1.2 0-2.5.8-3.4 1.8-.7.8-1.4 2.1-1.2 3.4 1.3 0 2.5-.8 3.4-1.7z"/></svg>
                Apple
            </button>
        </div>
    </div>

    <!-- Formulaire Inscription -->
    <div class="form-panel" id="panel-register">
        <form id="register-form" action="Traitement.php" method="POST" onsubmit="handleSubmit(event,'register')">
            <div class="input-box">
                <input type="text" id="reg-pseudo" name="pseudo" required>
                <label for="reg-pseudo">Pseudo</label>
            </div>
            <div class="input-box">
                <input type="email" id="reg-email" name="email" required>
                <label for="reg-email">Adresse email</label>
            </div>
            <div class="input-box">
                <input type="password" id="reg-password" name="password" required>
                <label for="reg-password">Mot de passe</label>
            </div>
            <button type="submit" class="submit-btn register" id="register-btn">
                <span class="btn-text">Créer mon compte</span>
                <div class="btn-spinner" id="register-spinner"></div>
            </button>
        </form>
    </div>
</div>

</body>
</html>
